name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Valeurs factices et PUBLIQUES — jamais les vraies clés. src/lib/env.ts exige
      # que ces deux variables soient présentes pour que `next build` passe.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-fake-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # Mission 88 — les règles d'accès de la base se prouvent dans la base : une base Supabase
  # locale, jetable, reconstruite à partir des migrations du dépôt (aucune base partagée, aucune
  # clé). Le test joue le navigateur d'un conseiller, d'un manager, d'un membre retiré et d'un
  # invité, et échoue à la première porte restée ouverte.
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - run: supabase db start

      - name: Portes fermées (profils, agence, invitations)
        run: |
          docker exec -i supabase_db_acm-studio psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < supabase/tests/closed_doors.sql

      # Mission 90 — la date du rendez-vous ne se réécrit plus, la signature se date une fois.
      - name: Conclusion (dates, type de mandat, prix, motif)
        run: |
          docker exec -i supabase_db_acm-studio psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < supabase/tests/conclusion_that_measures.sql

      - name: Note de closing figée à la conclusion
        run: |
          docker exec -i supabase_db_acm-studio psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < supabase/tests/launch_readiness.sql

      - name: Réponses du vendeur figées (devinettes, valeur perçue)
        run: |
          docker exec -i supabase_db_acm-studio psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < supabase/tests/frozen_seller_answers.sql

      # Mission 98 — la liste « Ne plus solliciter » : une agence ne lit pas celle d'une autre.
      - name: Liste d'opposition (cloisonnement par agence, ajout seul)
        run: |
          docker exec -i supabase_db_acm-studio psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < supabase/tests/prospecting_oppositions.sql

      - name: Rythme du Live et durée (début jamais remis à zéro, rythme figé en cours de Live)
        run: |
          docker exec -i supabase_db_acm-studio psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < supabase/tests/live_rhythm_and_duration.sql

      # Mission 96 — les relances : une agence ne lit pas celles d'une autre ; le prix révélé se fige.
      - name: Relance (motif, historique cloisonné par agence, prix révélé figé)
        run: |
          docker exec -i supabase_db_acm-studio psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < supabase/tests/follow_up_that_pays.sql

      # Mission 105 — membre retiré refusé partout, budget réservé sous le plafond, une annonce
      # par dossier, résultat payé cloisonné, date de prochaine relance.
      - name: Finitions (membre retiré, budget, unicité des annonces)
        run: |
          docker exec -i supabase_db_acm-studio psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < supabase/tests/finitions.sql

      # Mission 104 — rouvrir un Live figé par erreur : le serveur seul, avec un motif, tracé.
      - name: Réouverture d'un Live (opérateur seul, trace, réponses gardées)
        run: |
          docker exec -i supabase_db_acm-studio psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < supabase/tests/live_reopening.sql

      # Mission 100 — toutes les tables publiques, lues dans le catalogue : un membre d'une agence
      # ne lit ni n'écrit rien d'une autre. Une nouvelle table sans cloisonnement échoue ici.
      - name: Cloisonnement entre agences (toutes les tables)
        run: |
          docker exec -i supabase_db_acm-studio psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < supabase/tests/agency_isolation_all_tables.sql

      # Mission 102 — une adresse sans contact ni statut depuis 3 ans est effacée chaque nuit ;
      # la liste « Ne plus solliciter » reste, et l'opposition tient.
      - name: Durée de conservation des adresses de propriétaires
        run: |
          docker exec -i supabase_db_acm-studio psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < supabase/tests/owner_address_retention.sql

      - name: Gestes sensibles (conclusion, archivage, invitations, réglages, budget, journal)
        run: |
          docker exec -i supabase_db_acm-studio psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < supabase/tests/sensitive_gestures.sql

      # Mission 108 — le dossier de la même agence, les réglages par défaut écrits par le serveur
      # seul, la date de première relance.
      - name: Finitions de l'audit n°5
        run: |
          docker exec -i supabase_db_acm-studio psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < supabase/tests/finitions_audit_5.sql

      # Mission 109 — un dossier conclu ou archivé ne change plus par le Live.
      - name: Live fermé après la conclusion
        run: |
          docker exec -i supabase_db_acm-studio psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < supabase/tests/live_closed_after_conclusion.sql

      # Mission 110 — les objections et les liens de la synthèse au vendeur.
      - name: Prise de mandat
        run: |
          docker exec -i supabase_db_acm-studio psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < supabase/tests/prise_de_mandat.sql

      # Mission 110 — un Live plus court.
      - name: Live plus court
        run: |
          docker exec -i supabase_db_acm-studio psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < supabase/tests/live_plus_court.sql

      # Mission 110 — les experts : recherches nommées, mode expert, ordre du Live.
      - name: Les experts
        run: |
          docker exec -i supabase_db_acm-studio psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < supabase/tests/les_experts.sql

      # Mission 111 — les chiffres justes : première issue, prix d'un dossier conclu, écritures.
      - name: Les chiffres justes
        run: |
          docker exec -i supabase_db_acm-studio psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < supabase/tests/chiffres_justes.sql

      # Mission 112 — le Live ne s'ouvre jamais sans ses contrôles, ce qu'il montre ne bouge plus.
      - name: Le Live sous contrôle
        run: |
          docker exec -i supabase_db_acm-studio psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < supabase/tests/live_controle.sql

      # Mission 108 — les 14 tests SQL qui tournaient hors CI : leurs profils prennent les rôles
      # d'aujourd'hui (manager, conseiller), et deux suivent les décisions M90 et M92.
      - name: Tests SQL des missions précédentes
        run: |
          for test in capture_meeting_facts comparables_structured_characteristics \
            listing_observations live_seller_price_coherence live_seller_property_confirmation \
            live_seller_responses_and_summary meeting_conclusion meeting_outcomes \
            move_selected_comparable project_photos_storage project_price_positioning \
            project_readiness_bascule subject_property_diagnostics_and_condominium \
            subject_property_structured_fields; do
            echo "::group::$test"
            docker exec -i supabase_db_acm-studio psql -U postgres -d postgres \
              -v ON_ERROR_STOP=1 < "supabase/tests/$test.sql"
            echo "::endgroup::"
          done
