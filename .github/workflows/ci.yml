name: CI

# 09/11 (décision de Jean-Guy) — une CI allégée : rien sur `essai` (on n'y fusionne que des commits
# déjà passés sur leur branche), rien quand seuls `docs/`, `missions/` ou des `.md` changent — sauf
# les documents que lisent les tests (la démo, la fiche de l'extension, le guide de prise en main) —,
# une course remplacée par la suivante sur la même branche, et chaque lundi une course complète sur
# `main`, comme filet. Les tests SQL vivent dans `sql.yml`, lancés seulement quand `supabase/` change.
on:
  push:
    branches-ignore: [essai]
    paths:
      - '**'
      - '!docs/**'
      - '!missions/**'
      - '!**/*.md'
      - 'docs/DEMO.md'
      - 'docs/extension-store.md'
      - 'docs/guide/**'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Valeurs factices et PUBLIQUES — jamais les vraies clés. src/lib/env.ts exige
      # que ces deux variables soient présentes pour que `next build` passe.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-fake-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
