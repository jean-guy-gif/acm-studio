<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Montserrat, Inter, Arial, sans-serif">
<title>M127 — Suivi, mandat signé, avant la mise à jour</title>
<rect x="0" y="0" width="1280" height="800" rx="0" fill="#fafafa"/>
<rect x="0" y="0" width="232" height="800" rx="0" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><rect x="20" y="20" width="192" height="32" rx="16" fill="#f4f4f5"/><rect x="22" y="22" width="94" height="28" rx="14" fill="#0d4d78"/><text x="69" y="40" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Vendeur</text><text x="163" y="40" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#71717a" text-anchor="middle">Acquéreur</text><text x="28" y="86" font-family="Montserrat, Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#18181b">Préparation</text><text x="28" y="104" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#71717a">Dossiers vendeurs</text><text x="28" y="148" font-family="Montserrat, Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#18181b">Live</text><text x="28" y="166" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#71717a">Rendez-vous vendeur</text><rect x="12" y="188" width="208" height="52" rx="10" fill="#e8f1f8"/><text x="28" y="210" font-family="Montserrat, Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0d4d78">Suivi</text><text x="28" y="228" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#71717a">Après le rendez-vous</text><text x="28" y="272" font-family="Montserrat, Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#18181b">Prospection</text><text x="28" y="290" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#71717a">Concurrents à démarcher</text><rect x="12" y="728" width="208" height="56" rx="10" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text x="28" y="752" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#18181b">Compte de démonstration</text><text x="28" y="768" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#71717a">Mon compte et l’agence ▾</text><text x="264" y="50" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="28" font-weight="700" fill="#18181b">Suivi</text><text x="264" y="72" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12.5" fill="#71717a">Vos rendez-vous conclus, et ce qu’il reste à faire pour chacun.</text><rect x="264" y="92" width="236" height="62" rx="12" fill="#fff" stroke="#0d4d78" stroke-width="2"/><text x="280" y="122" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="22" font-weight="700" fill="#0d4d78">6</text><text x="280" y="142" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#71717a">Mandats signés · dont 4 exclusifs</text><rect x="514" y="92" width="236" height="62" rx="12" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text x="530" y="122" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="22" font-weight="700" fill="#18181b">12</text><text x="530" y="142" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#71717a">À relancer · 3 à relancer aujourd’hui</text><rect x="764" y="92" width="236" height="62" rx="12" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text x="780" y="122" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="22" font-weight="700" fill="#18181b">3</text><text x="780" y="142" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#71717a">Vendus ailleurs · retirés</text><rect x="1014" y="92" width="234" height="62" rx="12" fill="#0a3d5f"/><text x="1030" y="122" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">−7 %</text><text x="1030" y="142" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9.5" fill="#fff" opacity="0.85">Écart moyen : prix du vendeur → prix de commercialisation</text><rect x="264" y="172" width="43" height="20" rx="10" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text x="285.5" y="185.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#18181b" text-anchor="middle">Tous</text><rect x="320" y="172" width="106" height="20" rx="10" fill="#0d4d78"/><text x="373" y="185.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Mandats signés</text><rect x="436" y="172" width="81" height="20" rx="10" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text x="476.5" y="185.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#18181b" text-anchor="middle">À relancer</text><rect x="526" y="172" width="176" height="20" rx="10" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text x="614" y="185.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#18181b" text-anchor="middle">Vendus ailleurs · retirés</text><rect x="264" y="212" width="984" height="214" rx="14" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><rect x="264" y="212" width="6" height="214" rx="0" fill="#059669"/><path d="M264 226 Q264 212 278 212 L270 212 Z" fill="#fff"/><text x="286" y="242" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="16" font-weight="700" fill="#18181b">M. Lefebvre</text><rect x="382" y="228" width="94" height="20" rx="10" fill="#ecfdf5"/><text x="429" y="241.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">Mandat signé</text><rect x="490" y="228" width="68" height="20" rx="10" fill="#e8f1f8"/><text x="524" y="241.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#0d4d78" text-anchor="middle">Exclusif</text><text x="286" y="264" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" fill="#71717a">Villa · 7 pièces · 210 m² · Mougins · conclu le 12/10 · Durée du Live : 48 min</text><text x="734" y="236" font-family="Montserrat, Inter, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#71717a" letter-spacing="1.4">LE CHEMIN PARCOURU</text><text x="734" y="260" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="14" font-weight="700" fill="#18181b">1 774 500 €  →  1 690 000 €  →  1 639 500 €</text><rect x="1006" y="246" width="46" height="20" rx="10" fill="#ecfdf5"/><text x="1029" y="259.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">−8 %</text><text x="734" y="292" font-family="Montserrat, Inter, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#71717a" letter-spacing="1.4">PRÊT À LANCER</text><text x="734" y="314" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="14" font-weight="700" fill="#18181b">7 → 10/10</text><rect x="1054" y="230" width="176" height="34" rx="17" fill="#0d4d78" stroke="#0d4d78" stroke-width="1.5"/><text x="1142" y="251.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Prospecter · 5 concurrents →</text><text x="1230" y="282" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#71717a" text-anchor="end">1 remis · 1 adresse à confirmer · 1 ne plus solliciter</text><text x="1230" y="312" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0d4d78" text-anchor="end">Voir le détail des prix ▾</text><rect x="286" y="334" width="130" height="32" rx="16" fill="#fff" stroke="#0d4d78" stroke-width="1.5"/><text x="351" y="354.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0d4d78" text-anchor="middle">Changer l’issue</text><rect x="430" y="334" width="230" height="32" rx="16" fill="#fff" stroke="#0d4d78" stroke-width="1.5"/><text x="545" y="354.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0d4d78" text-anchor="middle">Mettre à jour les concurrents</text><line x1="286" y1="380" x2="1226" y2="380" stroke="#e4e4e7" stroke-width="1"/><text x="286" y="400" font-family="Montserrat, Inter, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#71717a" letter-spacing="1.4">POINTS MARCHÉ</text><text x="286" y="418" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11.5" fill="#71717a">Aucun point marché pour ce mandat. La relecture des annonces est gratuite ; le premier Point marché s’écrira à la fin de la mise à jour.</text><rect x="264" y="446" width="984" height="86" rx="14" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><rect x="264" y="446" width="6" height="86" rx="0" fill="#059669"/><text x="286" y="476" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="16" font-weight="700" fill="#18181b">M. et Mme Martin</text><rect x="430" y="462" width="94" height="20" rx="10" fill="#ecfdf5"/><text x="477" y="475.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">Mandat signé</text><text x="286" y="498" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" fill="#71717a">Maison · 5 pièces · 140 m² · Vence · conclu le 05/10</text><text x="734" y="470" font-family="Montserrat, Inter, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#71717a" letter-spacing="1.4">LE CHEMIN PARCOURU</text><text x="734" y="494" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="14" font-weight="700" fill="#18181b">720 000 €  →  680 000 €</text><rect x="1054" y="464" width="176" height="34" rx="17" fill="#0d4d78" stroke="#0d4d78" stroke-width="1.5"/><text x="1142" y="485.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Prospecter · 4 concurrents →</text><rect x="264" y="560" width="984" height="200" rx="12" fill="#fff" stroke="#0d4d78" stroke-width="1" stroke-dasharray="5 4"/><text x="284" y="586" font-family="Montserrat, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d4d78">Ce qui change sur la ligne d’un mandat signé (M127)</text><text x="284" y="612" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11.5" fill="#18181b">• « Mettre à jour les prix des concurrents » (M105) devient « Mettre à jour les concurrents », en contour : « Prospecter » reste le seul bouton plein de la ligne.</text><text x="284" y="638" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11.5" fill="#18181b">• Sous la barre, une zone « Points marché » : vide au départ (cette phrase), puis la liste des points datés, le plus récent en premier.</text><text x="284" y="664" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11.5" fill="#18181b">• La mise à jour s’enchaîne dans un panneau sous la ligne : (a) relecture → (b) ce qu’elle conclut → (c) la proposition payante. Un seul bouton plein dans le panneau.</text><text x="284" y="690" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11.5" fill="#18181b">• « Voir le détail des prix » gagne, à côté de « Ce que le vendeur a dit », les trois lignes du dernier point (maquette 04).</text><text x="284" y="716" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11.5" fill="#18181b">• En 1024 × 768, la ligne passe sur deux rangées (@xl) : le chemin et les actions sous le nom ; les boutons de la barre restent sur une ligne.</text>
</svg>
