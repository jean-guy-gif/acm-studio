, Inter, Arial, sans-serif" font-size="9.5" fill="#18181b">Aujourd’hui, 1 concurrent sur 3 est passé sous</text><text x="38" y="519" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9.5" fill="#18181b">votre prix : le 2e moins cher des 4 biens encore</text><text x="38" y="532" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9.5" fill="#18181b">en vente. 2 annonces ont disparu : 1 vente</text><text x="38" y="545" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9.5" fill="#18181b">probable, 1 retirée sans vente.</text><rect x="16" y="580" width="358" height="226" rx="10" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text x="28" y="604" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#18181b">3 · Face aux nouveaux venus</text><line x1="28" y1="650" x2="362" y2="650" stroke="#cbd5e1" stroke-width="3"/><text x="28" y="666" font-family="Montserrat, Inter, Arial, sans-serif" font-size="8.5" fill="#71717a">1,55 M€</text><text x="362" y="666" font-family="Montserrat, Inter, Arial, sans-serif" font-size="8.5" fill="#71717a" text-anchor="end">1,85 M€</text><circle cx="61.4" cy="650" r="5" fill="#94a3b8"/><line x1="200.5666666666667" y1="641" x2="200.5666666666667" y2="659" stroke="#18181b" stroke-width="2.5"/><circle cx="339.73333333333335" cy="650" r="5" fill="#94a3b8"/><rect x="125.14333333333333" y="637" width="5" height="26" rx="2" fill="#059669"/><text x="28" y="686" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9" fill="#71717a">●</text><text x="42" y="686" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#71717a">Le plus bas : 1 580 000 €</text><text x="28" y="700" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9" fill="#71717a">|</text><text x="42" y="700" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#71717a">Prix médian : 1 705 000 €</text><text x="28" y="714" fo