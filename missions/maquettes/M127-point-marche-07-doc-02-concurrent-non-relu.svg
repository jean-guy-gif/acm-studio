ont-size="20" font-weight="700" fill="#71717a">—</text><text x="526" y="600" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" fill="#71717a">sans prix du rendez-vous, pas d’écart</text><rect x="72" y="626" width="650" height="40" rx="0" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/><text x="86" y="650" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#18181b">Toujours en vente · depuis environ 160 jours · 7 511 €/m² aujourd’hui</text><text x="56" y="1083" font-family="Montserrat, Inter, Arial, sans-serif" font-size="7.5" fill="#64748b" letter-spacing="1.2">ÉTUDE CONFIDENTIELLE · MOUGINS · 15 NOVEMBRE 2026</text><text x="738" y="1083" font-family="Montserrat, Inter, Arial, sans-serif" font-size="7.5" fill="#64748b" text-anchor="end">02 / 09</text>
