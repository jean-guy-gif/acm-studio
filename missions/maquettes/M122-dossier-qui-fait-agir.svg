<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="1200" height="860" fill="#f3f5f9"/>
  <text x="40" y="44" font-size="22" font-weight="800" fill="#132139">Le dossier qui fait agir — trois écrans du lien, sur téléphone</text>
  <text x="40" y="70" font-size="14" fill="#657287">Construit autour de SA recherche, pas autour des biens. Il ne se lit pas : il se répond.</text>

  <!-- PHONE 1 : la grille -->
  <g transform="translate(40,100)">
    <rect width="340" height="700" rx="34" fill="#132139"/>
    <rect x="12" y="12" width="316" height="676" rx="26" fill="#fff"/>
    <text x="32" y="56" font-size="11" letter-spacing="2" fill="#167d75" font-weight="700">VOTRE SÉLECTION · 3 BIENS</text>
    <text x="32" y="86" font-size="20" font-weight="800" fill="#132139">Vous m'avez dit :</text>
    <text x="32" y="110" font-size="13" fill="#4b5668">« Un 3 pièces à Antibes, avec un</text>
    <text x="32" y="128" font-size="13" fill="#4b5668">extérieur, au calme, sous 430 000 €. »</text>
    <text x="32" y="168" font-size="12" font-weight="700" fill="#132139">Vos critères</text>
    <g font-size="12" fill="#132139">
      <text x="196" y="168" font-weight="700" text-anchor="middle">A</text>
      <text x="246" y="168" font-weight="700" text-anchor="middle">B</text>
      <text x="296" y="168" font-weight="700" text-anchor="middle">C</text>
    </g>
    <g font-size="12.5" fill="#132139">
      <line x1="32" y1="180" x2="310" y2="180" stroke="#e3e8f0"/>
      <text x="32" y="202">Antibes ★</text>
      <text x="32" y="236">3 pièces ★</text>
      <text x="32" y="270">Extérieur ★</text>
      <text x="32" y="304">Budget ≤ 430 000 €</text>
      <text x="32" y="338">65 m² et plus</text>
      <text x="32" y="372">Parking</text>
      <text x="32" y="406">Ascenseur</text>
    </g>
    <g font-size="17" text-anchor="middle" font-weight="800">
      <text x="196" y="203" fill="#167d75">✓</text><text x="246" y="203" fill="#167d75">✓</text><text x="296" y="203" fill="#167d75">✓</text>
      <text x="196" y="237" fill="#167d75">✓</text><text x="246" y="237" fill="#167d75">✓</text><text x="296" y="237" fill="#167d75">✓</text>
      <text x="196" y="271" fill="#167d75">✓</text><text x="246" y="271" fill="#167d75">✓</text><text x="296" y="271" fill="#167d75">✓</text>
      <text x="196" y="305" fill="#167d75">✓</text><text x="246" y="305" fill="#167d75">✓</text><text x="296" y="305" fill="#c27a1a">≈</text>
      <text x="196" y="339" fill="#167d75">✓</text><text x="246" y="339" fill="#c27a1a">≈</text><text x="296" y="339" fill="#167d75">✓</text>
      <text x="196" y="373" fill="#167d75">✓</text><text x="246" y="373" fill="#9aa4b4">?</text><text x="296" y="373" fill="#167d75">✓</text>
      <text x="196" y="407" fill="#9aa4b4">?</text><text x="246" y="407" fill="#167d75">✓</text><text x="296" y="407" fill="#167d75">✓</text>
    </g>
    <g font-size="11" fill="#657287">
      <text x="32" y="444">★ indispensable · ≈ proche · ? à vérifier ensemble</text>
    </g>
    <rect x="32" y="470" width="276" height="64" rx="12" fill="#eaf7f5"/>
    <text x="48" y="496" font-size="13" font-weight="700" fill="#167d75">Le bien A coche tous vos critères.</text>
    <text x="48" y="516" font-size="12" fill="#167d75">C'est par lui que je vous propose de commencer.</text>
    <rect x="32" y="560" width="276" height="48" rx="24" fill="#132139"/>
    <text x="170" y="590" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Voir le bien A →</text>
    <text x="170" y="640" font-size="11" fill="#9aa4b4" text-anchor="middle">1 / 5</text>
  </g>

  <!-- PHONE 2 : un bien -->
  <g transform="translate(430,100)">
    <rect width="340" height="700" rx="34" fill="#132139"/>
    <rect x="12" y="12" width="316" height="676" rx="26" fill="#fff"/>
    <rect x="12" y="12" width="316" height="200" rx="26" fill="#c9d3e3"/>
    <rect x="12" y="150" width="316" height="62" fill="#c9d3e3"/>
    <text x="170" y="118" font-size="13" fill="#6b7a92" text-anchor="middle">photo principale</text>
    <g><rect x="32" y="222" width="86" height="58" rx="8" fill="#dbe2ee"/><rect x="127" y="222" width="86" height="58" rx="8" fill="#dbe2ee"/><rect x="222" y="222" width="86" height="58" rx="8" fill="#dbe2ee"/></g>
    <text x="32" y="310" font-size="11" letter-spacing="2" fill="#167d75" font-weight="700">BIEN A · 7 CRITÈRES SUR 7</text>
    <text x="32" y="336" font-size="18" font-weight="800" fill="#132139">3 pièces · 68 m² · Antibes</text>
    <g font-size="12.5" fill="#132139">
      <text x="32" y="368" fill="#167d75" font-weight="700">✓</text><text x="52" y="368">Terrasse de 12 m², plein sud</text>
      <text x="32" y="390" fill="#167d75" font-weight="700">✓</text><text x="52" y="390">2 chambres, comme demandé</text>
      <text x="32" y="412" fill="#167d75" font-weight="700">✓</text><text x="52" y="412">Dans votre budget, 15 000 € de marge</text>
      <text x="32" y="434" fill="#9aa4b4" font-weight="700">?</text><text x="52" y="434">Ascenseur : à vérifier à la visite</text>
    </g>
    <rect x="32" y="452" width="276" height="62" rx="12" fill="#f5f7fb"/>
    <text x="46" y="476" font-size="11" font-weight="700" fill="#657287">POURQUOI JE VOUS LE PROPOSE</text>
    <text x="46" y="498" font-size="12" fill="#132139" font-style="italic">« Le calme que vous cherchiez, à 5 min du marché. »</text>
    <text x="32" y="540" font-size="11.5" fill="#c27a1a">● En vente depuis 9 jours · aucune baisse de prix</text>
    <rect x="32" y="560" width="276" height="44" rx="22" fill="#167d75"/>
    <text x="170" y="587" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Je veux le visiter</text>
    <rect x="32" y="612" width="132" height="38" rx="19" fill="#fff" stroke="#d5dce8"/>
    <text x="98" y="636" font-size="12.5" fill="#132139" text-anchor="middle">Peut-être</text>
    <rect x="176" y="612" width="132" height="38" rx="19" fill="#fff" stroke="#d5dce8"/>
    <text x="242" y="636" font-size="12.5" fill="#132139" text-anchor="middle">Pas pour moi</text>
  </g>

  <!-- PHONE 3 : la réponse -->
  <g transform="translate(820,100)">
    <rect width="340" height="700" rx="34" fill="#132139"/>
    <rect x="12" y="12" width="316" height="676" rx="26" fill="#fff"/>
    <text x="32" y="56" font-size="11" letter-spacing="2" fill="#167d75" font-weight="700">VOTRE RÉPONSE</text>
    <text x="32" y="86" font-size="19" font-weight="800" fill="#132139">Vous voulez visiter A et C.</text>
    <text x="32" y="122" font-size="13" font-weight="700" fill="#132139">Quand êtes-vous disponible ?</text>
    <g font-size="12.5">
      <rect x="32" y="136" width="132" height="38" rx="10" fill="#132139"/><text x="98" y="160" fill="#fff" text-anchor="middle">Samedi matin</text>
      <rect x="176" y="136" width="132" height="38" rx="10" fill="#fff" stroke="#d5dce8"/><text x="242" y="160" fill="#132139" text-anchor="middle">Samedi après-midi</text>
      <rect x="32" y="182" width="132" height="38" rx="10" fill="#fff" stroke="#d5dce8"/><text x="98" y="206" fill="#132139" text-anchor="middle">En semaine, soir</text>
      <rect x="176" y="182" width="132" height="38" rx="10" fill="#132139"/><text x="242" y="206" fill="#fff" text-anchor="middle">Mercredi</text>
    </g>
    <line x1="32" y1="246" x2="308" y2="246" stroke="#e3e8f0"/>
    <text x="32" y="276" font-size="13" font-weight="700" fill="#132139">Le bien B : pas pour vous. Pourquoi ?</text>
    <g font-size="12">
      <rect x="32" y="290" width="90" height="32" rx="16" fill="#fff" stroke="#d5dce8"/><text x="77" y="311" text-anchor="middle" fill="#132139">Le quartier</text>
      <rect x="130" y="290" width="74" height="32" rx="16" fill="#132139"/><text x="167" y="311" text-anchor="middle" fill="#fff">Surface</text>
      <rect x="212" y="290" width="96" height="32" rx="16" fill="#fff" stroke="#d5dce8"/><text x="260" y="311" text-anchor="middle" fill="#132139">Pas de parking</text>
      <rect x="32" y="330" width="70" height="32" rx="16" fill="#fff" stroke="#d5dce8"/><text x="67" y="351" text-anchor="middle" fill="#132139">Le prix</text>
      <rect x="110" y="330" width="96" height="32" rx="16" fill="#fff" stroke="#d5dce8"/><text x="158" y="351" text-anchor="middle" fill="#132139">Les photos</text>
      <rect x="214" y="330" width="60" height="32" rx="16" fill="#fff" stroke="#d5dce8"/><text x="244" y="351" text-anchor="middle" fill="#132139">Autre</text>
    </g>
    <rect x="32" y="394" width="276" height="120" rx="14" fill="#eaf7f5"/>
    <text x="48" y="420" font-size="11" font-weight="700" fill="#167d75">CE QUE JE FAIS ENSUITE</text>
    <text x="48" y="444" font-size="12.5" fill="#132139">Je contacte les propriétaires de A et C</text>
    <text x="48" y="464" font-size="12.5" fill="#132139">et je vous confirme les visites sous 24 h.</text>
    <text x="48" y="494" font-size="12" fill="#657287">Jean-Guy · 06 12 34 56 78</text>
    <rect x="32" y="540" width="276" height="48" rx="24" fill="#167d75"/>
    <text x="170" y="570" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Envoyer ma réponse</text>
    <text x="170" y="620" font-size="11" fill="#9aa4b4" text-anchor="middle">Vos réponses affinent ma prochaine recherche.</text>
  </g>
</svg>
