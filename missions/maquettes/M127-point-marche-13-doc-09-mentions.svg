<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" font-family="Montserrat, Inter, Arial, sans-serif">
<title>M127 — Point marché, dernière page</title>
<rect x="0" y="0" width="794" height="1123" rx="0" fill="#fff"/><text x="56" y="70" font-family="Montserrat, Inter, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#0d4d78" letter-spacing="1.5">POUR LIRE CE DOCUMENT</text><line x1="56" y1="80" x2="738" y2="80" stroke="#0d4d78" stroke-width="1"/><text x="56" y="106" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#18181b">Les prix cités sont ceux des annonces, pas des prix de vente.</text><text x="56" y="124" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#18181b">Une annonce disparue n’est pas une vente constatée : « vente probable » et la négociation « estimée » sont déduites</text><text x="56" y="142" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#18181b">de la durée de commercialisation au retrait, selon la règle de l’agence ; « retiré sans vente » dit une annonce retirée</text><text x="56" y="160" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#18181b">après plus de 300 jours. Rien ici n’affirme qu’un bien est vendu, ni à quel prix.</text><text x="56" y="178" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#18181b">Surfaces et caractéristiques telles qu’annoncées, à vérifier. « Vu sur le marché depuis le … » est la date à laquelle</text><text x="56" y="196" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#18181b">l’annonce a été vue pour la première fois, pas sa date de publication.</text><rect x="56" y="220" width="682" height="110" rx="0" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><circle cx="106" cy="275" r="30" fill="#cfd8e3"/><text x="106" y="279" font-family="Montserrat, Inter, Arial, sans-serif" font-size="8" fill="#6b7a92" text-anchor="middle">photo</text><text x="156" y="252" font-family="Montserrat, Inter, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#71717a" letter-spacing="1.4">VOTRE CONSEILLER</text><text x="156" y="276" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="16" font-weight="700" fill="#18181b">Jean-Guy Ourmières</text><text x="156" y="296" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#71717a">06 00 00 00 01 · demo@start-academy.fr</text><rect x="652" y="236" width="70" height="70" rx="0" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><rect x="658" y="242" width="9" height="9" rx="0" fill="#18181b"/><rect x="658" y="252" width="9" height="9" rx="0" fill="#18181b"/><rect x="658" y="262" width="9" height="9" rx="0" fill="#18181b"/><rect x="658" y="282" width="9" height="9" rx="0" fill="#18181b"/><rect x="658" y="292" width="9" height="9" rx="0" fill="#18181b"/><rect x="668" y="242" width="9" height="9" rx="0" fill="#18181b"/><rect x="668" y="252" width="9" height="9" rx="0" fill="#18181b"/><rect x="668" y="272" width="9" height="9" rx="0" fill="#18181b"/><rect x="668" y="282" width="9" height="9" rx="0" fill="#18181b"/><rect x="668" y="292" width="9" height="9" rx="0" fill="#18181b"/><rect x="678" y="242" width="9" height="9" rx="0" fill="#18181b"/><rect x="678" y="262" width="9" height="9" rx="0" fill="#18181b"/><rect x="678" y="272" width="9" height="9" rx="0" fill="#18181b"/><rect x="678" y="282" width="9" height="9" rx="0" fill="#18181b"/><rect x="688" y="252" width="9" height="9" rx="0" fill="#18181b"/><rect x="688" y="262" width="9" height="9" rx="0" fill="#18181b"/><rect x="688" y="272" width="9" height="9" rx="0" fill="#18181b"/><rect x="688" y="292" width="9" height="9" rx="0" fill="#18181b"/><rect x="698" y="242" width="9" height="9" rx="0" fill="#18181b"/><rect x="698" y="252" width="9" height="9" rx="0" fill="#18181b"/><rect x="698" y="262" width="9" height="9" rx="0" fill="#18181b"/><rect x="698" y="282" width="9" height="9" rx="0" fill="#18181b"/><rect x="698" y="292" width="9" height="9" rx="0" fill="#18181b"/><rect x="708" y="242" width="9" height="9" rx="0" fill="#18181b"/><rect x="708" y="252" width="9" height="9" rx="0" fill="#18181b"/><rect x="708" y="272" width="9" height="9" rx="0" fill="#18181b"/><rect x="708" y="282" width="9" height="9" rx="0" fill="#18181b"/><rect x="708" y="292" width="9" height="9" rx="0" fill="#18181b"/><text x="687" y="320" font-family="Montserrat, Inter, Arial, sans-serif" font-size="7.5" fill="#71717a" text-anchor="middle">carte de contact</text><text x="56" y="360" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9" font-weight="700" fill="#0d4d78" letter-spacing="1">LOGO DE L’AGENCE · Agence de démonstration</text><text x="56" y="380" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9.5" fill="#71717a">Carte professionnelle CPI 0605 2024 000 000 123 délivrée par la CCI Nice Côte d’Azur · Ne peut recevoir aucun fonds</text><text x="56" y="396" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9.5" fill="#71717a">12 avenue de la Démonstration, 06600 Antibes</text><text x="56" y="430" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9.5" fill="#71717a" font-style="italic">Le reste de la page est blanc : le document se termine ici.</text><text x="56" y="1083" font-family="Montserrat, Inter, Arial, sans-serif" font-size="7.5" fill="#64748b" letter-spacing="1.2">ÉTUDE CONFIDENTIELLE · MOUGINS · 15 NOVEMBRE 2026</text><text x="738" y="1083" font-family="Montserrat, Inter, Arial, sans-serif" font-size="7.5" fill="#64748b" text-anchor="end">09 / 09</text>
