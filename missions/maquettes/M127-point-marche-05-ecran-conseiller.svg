<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Montserrat, Inter, Arial, sans-serif">
<title>M127 — Écran conseiller du Point marché</title>
<rect x="0" y="0" width="1280" height="800" rx="0" fill="#fafafa"/>
<rect x="0" y="0" width="232" height="800" rx="0" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><rect x="20" y="20" width="192" height="32" rx="16" fill="#f4f4f5"/><rect x="22" y="22" width="94" height="28" rx="14" fill="#0d4d78"/><text x="69" y="40" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Vendeur</text><text x="163" y="40" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#71717a" text-anchor="middle">Acquéreur</text><text x="28" y="86" font-family="Montserrat, Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#18181b">Préparation</text><text x="28" y="104" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#71717a">Dossiers vendeurs</text><text x="28" y="148" font-family="Montserrat, Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#18181b">Live</text><text x="28" y="166" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#71717a">Rendez-vous vendeur</text><rect x="12" y="188" width="208" height="52" rx="10" fill="#e8f1f8"/><text x="28" y="210" font-family="Montserrat, Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0d4d78">Suivi</text><text x="28" y="228" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#71717a">Après le rendez-vous</text><text x="28" y="272" font-family="Montserrat, Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#18181b">Prospection</text><text x="28" y="290" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#71717a">Concurrents à démarcher</text><rect x="12" y="728" width="208" height="56" rx="10" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text x="28" y="752" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#18181b">Compte de démonstration</text><text x="28" y="768" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#71717a">Mon compte et l’agence ▾</text><text x="264" y="50" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="28" font-weight="700" fill="#18181b">Point marché</text><text x="264" y="72" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12.5" fill="#71717a">M. Lefebvre · Villa · 7 pièces · 210 m² · Mougins · mandat signé le 12/10</text><text x="264" y="100" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#0d4d78">← Retour au Suivi</text><rect x="264" y="116" width="400" height="664" rx="14" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text x="284" y="142" font-family="Montserrat, Inter, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#71717a" letter-spacing="1.4">POINT</text><rect x="284" y="152" width="360" height="36" rx="8" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text x="298" y="175" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#18181b">Point du 15/11 — 5 relues · 2 baisses · 2 nouveaux venus</text><text x="630" y="175" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" fill="#71717a">▾</text><text x="284" y="212" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11.5" fill="#18181b">Ce document montre au vendeur ce qui a bougé depuis le rendez-vous</text><text x="284" y="228" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11.5" fill="#18181b">du 12/10 : chaque concurrent, son prix d’alors et d’aujourd’hui, les</text><text x="284" y="244" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11.5" fill="#18181b">annonces disparues, les nouveaux venus, puis où en est son prix.</text><text x="284" y="260" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11.5" fill="#18181b">Ni adresse, ni titre, ni lien d’annonce ; « estimé » partout où l’outil déduit.</text><rect x="284" y="282" width="360" height="40" rx="20" fill="#0d4d78" stroke="#0d4d78" stroke-width="1.5"/><text x="464" y="306.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Imprimer</text><rect x="284" y="332" width="360" height="38" rx="19" fill="#fff" stroke="#0d4d78" stroke-width="1.5"/><text x="464" y="355.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0d4d78" text-anchor="middle">Créer un lien pour le vendeur (30 jours)</text><text x="284" y="392" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#71717a">Sans compte, jamais indexé, 30 jours ; l’outil n’envoie rien.</text><line x1="284" y1="412" x2="644" y2="412" stroke="#e4e4e7" stroke-width="1"/><text x="284" y="436" font-family="Montserrat, Inter, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#71717a" letter-spacing="1.4">PHOTOS DES CONCURRENTS</text><text x="284" y="454" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#71717a">Cochez « Sans photo » pour retirer la photo du document imprimé et du lien.</text><rect x="284" y="474" width="14" height="14" rx="3" fill="#fff" stroke="#a1a1aa" stroke-width="1"/><text x="304" y="485.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" fill="#18181b">Sans photo · Concurrent 1 · Villa · 7 pièces · 225 m² · Valbonne</text><rect x="284" y="504" width="14" height="14" rx="3" fill="#fff" stroke="#a1a1aa" stroke-width="1"/><text x="304" y="515.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" fill="#18181b">Sans photo · Concurrent 2 · Villa · 7 pièces · 212 m² · Mougins</text><rect x="284" y="534" width="14" height="14" rx="3" fill="#0d4d78" stroke="#0d4d78" stroke-width="1"/><text x="291" y="545" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">✓</text><text x="304" y="545.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" fill="#18181b">Sans photo · Concurrent 3 · Villa · 7 pièces · 220 m² · Mougins</text><rect x="284" y="564" width="14" height="14" rx="3" fill="#fff" stroke="#a1a1aa" stroke-width="1"/><text x="304" y="575.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" fill="#18181b">Sans photo · Concurrent 4 · Villa · 7 pièces · 205 m² · Mougins</text><rect x="284" y="594" width="14" height="14" rx="3" fill="#fff" stroke="#a1a1aa" stroke-width="1"/><text x="304" y="605.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" fill="#18181b">Sans photo · Concurrent 5 · Villa · 7 pièces · 240 m² · Mougins</text><line x1="284" y1="640" x2="644" y2="640" stroke="#e4e4e7" stroke-width="1"/><text x="284" y="664" font-family="Montserrat, Inter, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#71717a" letter-spacing="1.4">NOUVEAUX VENUS</text><rect x="284" y="680" width="14" height="14" rx="3" fill="#fff" stroke="#a1a1aa" stroke-width="1"/><text x="304" y="691.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" fill="#18181b">Sans photo · Nouveau venu 1 · Villa · 7 pièces · 210 m² · Mougins</text><rect x="284" y="710" width="14" height="14" rx="3" fill="#fff" stroke="#a1a1aa" stroke-width="1"/><text x="304" y="721.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" fill="#18181b">Sans photo · Nouveau venu 2 · Villa · 7 pièces · 215 m² · Mougins</text><text x="284" y="756" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#71717a" font-style="italic">Rien ici n’est imprimé.</text><rect x="690" y="116" width="558" height="664" rx="14" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text x="710" y="142" font-family="Montserrat, Inter, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#71717a" letter-spacing="1.4">APERÇU · 9 PAGES · A4</text><text x="1228" y="142" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#71717a" text-anchor="end">Défiler pour tout voir</text><rect x="710" y="156" width="518" height="300" rx="0" fill="#0a3d5f"/><rect x="710" y="156" width="518" height="300" rx="0" fill="#cfd8e3"/><path d="M761.8 396 L906.84 291 L994.9000000000001 351 L1062.24 312 L1176.2 396 Z" fill="#b8c4d3"/><circle cx="1098.5" cy="240" r="21.000000000000004" fill="#e6ecf3"/><text x="969" y="448" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9" fill="#6b7a92" text-anchor="middle"></text><rect x="710" y="300" width="518" height="156" rx="0" fill="#0a3d5f"/><rect x="710" y="236" width="518" height="80" fill="url(#g)"/><text x="730" y="184" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" letter-spacing="1.5">LOGO DE L’AGENCE</text><text x="1208" y="184" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9" fill="#fff" text-anchor="end" letter-spacing="1.5">15 NOVEMBRE 2026</text><rect x="730" y="326" width="92" height="18" rx="0" fill="none" stroke="#fff" stroke-width="1"/><text x="776" y="339" font-family="Montserrat, Inter, Arial, sans-serif" font-size="8" fill="#fff" text-anchor="middle" letter-spacing="1.5">POINT MARCHÉ</text><text x="730" y="362" font-family="Montserrat, Inter, Arial, sans-serif" font-size="8.5" fill="#fff" letter-spacing="2">VILLA · MOUGINS</text><text x="730" y="394" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff">Point marché</text><text x="730" y="420" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">du 15 novembre 2026</text><text x="730" y="442" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#fff">Depuis notre rendez-vous du 12 octobre 2026 · Pour M. Lefebvre</text><rect x="710" y="470" width="518" height="300" rx="0" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><rect x="726" y="486" width="24" height="24" rx="0" fill="none" stroke="#0d4d78" stroke-width="1"/><text x="738" y="503" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#0d4d78" text-anchor="middle">01</text><text x="760" y="504" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="16" font-weight="700" fill="#0d4d78">Les concurrents, depuis le rendez-vous</text><line x1="726" y1="516" x2="1212" y2="516" stroke="#0d4d78" stroke-width="2"/><text x="726" y="540" font-family="Montserrat, Inter, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#71717a" letter-spacing="1.4">CONCURRENT 1 · LE PLUS DANGEREUX, SELON VOUS</text><text x="726" y="560" font-family="Montserrat, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#18181b">Villa · 7 pièces · 225 m² · Valbonne</text><rect x="726" y="572" width="114" height="76" rx="0" fill="#cfd8e3"/><path d="M737.4 632.8 L769.32 606.2 L788.7 621.4 L803.52 611.52 L828.6 632.8 Z" fill="#b8c4d3"/><circle cx="811.5" cy="593.28" r="5.32" fill="#e6ecf3"/><text x="783" y="640" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9" fill="#6b7a92" text-anchor="middle"></text><rect x="848" y="572" width="114" height="76" rx="0" fill="#cfd8e3"/><path d="M859.4 632.8 L891.32 606.2 L910.7 621.4 L925.52 611.52 L950.6 632.8 Z" fill="#b8c4d3"/><circle cx="933.5" cy="593.28" r="5.32" fill="#e6ecf3"/><text x="905" y="640" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9" fill="#6b7a92" text-anchor="middle"></text><rect x="970" y="572" width="114" height="76" rx="0" fill="#cfd8e3"/><path d="M981.4 632.8 L1013.32 606.2 L1032.7 621.4 L1047.52 611.52 L1072.6 632.8 Z" fill="#b8c4d3"/><circle cx="1055.5" cy="593.28" r="5.32" fill="#e6ecf3"/><text x="1027" y="640" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9" fill="#6b7a92" text-anchor="middle"></text><rect x="1092" y="572" width="114" height="76" rx="0" fill="#cfd8e3"/><path d="M1103.4 632.8 L1135.32 606.2 L1154.7 621.4 L1169.52 611.52 L1194.6 632.8 Z" fill="#b8c4d3"/><circle cx="1177.5" cy="593.28" r="5.32" fill="#e6ecf3"/><text x="1149" y="640" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9" fill="#6b7a92" text-anchor="middle"></text><text x="726" y="672" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" fill="#18181b">Surface  225 m² (vous : 210 m²)</text><text x="726" y="690" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" fill="#18181b">Terrain  2 400 m² (vous : 1 800 m²)</text><text x="726" y="708" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" fill="#18181b">Pièces · chambres  7 · 5 (vous : 7 · 4)</text><text x="726" y="726" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" fill="#18181b">…</text><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a3d5f" stop-opacity="0"/><stop offset="1" stop-color="#0a3d5f" stop-opacity="1"/></linearGradient></defs>
