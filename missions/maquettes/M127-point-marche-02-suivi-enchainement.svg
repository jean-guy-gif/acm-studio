<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Montserrat, Inter, Arial, sans-serif">
<title>M127 — Suivi, l’enchaînement a → b → c</title>
<rect x="0" y="0" width="1280" height="800" rx="0" fill="#fafafa"/>
<rect x="0" y="0" width="232" height="800" rx="0" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><rect x="20" y="20" width="192" height="32" rx="16" fill="#f4f4f5"/><rect x="22" y="22" width="94" height="28" rx="14" fill="#0d4d78"/><text x="69" y="40" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Vendeur</text><text x="163" y="40" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#71717a" text-anchor="middle">Acquéreur</text><text x="28" y="86" font-family="Montserrat, Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#18181b">Préparation</text><text x="28" y="104" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#71717a">Dossiers vendeurs</text><text x="28" y="148" font-family="Montserrat, Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#18181b">Live</text><text x="28" y="166" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#71717a">Rendez-vous vendeur</text><rect x="12" y="188" width="208" height="52" rx="10" fill="#e8f1f8"/><text x="28" y="210" font-family="Montserrat, Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0d4d78">Suivi</text><text x="28" y="228" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#71717a">Après le rendez-vous</text><text x="28" y="272" font-family="Montserrat, Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#18181b">Prospection</text><text x="28" y="290" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#71717a">Concurrents à démarcher</text><rect x="12" y="728" width="208" height="56" rx="10" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text x="28" y="752" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#18181b">Compte de démonstration</text><text x="28" y="768" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#71717a">Mon compte et l’agence ▾</text><text x="264" y="50" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="28" font-weight="700" fill="#18181b">Suivi</text><text x="264" y="72" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12.5" fill="#71717a">L’enchaînement de « Mettre à jour les concurrents » : trois instants de la même ligne.</text><text x="264" y="86" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#0d4d78">(a) Relecture en cours — aucun appel payant</text><rect x="264" y="96" width="984" height="92" rx="14" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><rect x="264" y="96" width="6" height="92" rx="0" fill="#059669"/><text x="286" y="124" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="16" font-weight="700" fill="#18181b">M. Lefebvre</text><rect x="382" y="110" width="94" height="20" rx="10" fill="#ecfdf5"/><text x="429" y="123.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">Mandat signé</text><rect x="286" y="142" width="130" height="32" rx="16" fill="#fff" stroke="#0d4d78" stroke-width="1.5"/><text x="351" y="162.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0d4d78" text-anchor="middle">Changer l’issue</text><rect x="430" y="142" width="230" height="32" rx="16" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/><text x="545" y="162" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#71717a" text-anchor="middle">Relecture 3 sur 5…</text><rect x="680" y="154" width="300" height="8" rx="4" fill="#f4f4f5"/><rect x="680" y="154" width="180" height="8" rx="4" fill="#0d4d78"/><text x="996" y="158" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#71717a">Par l’extension ACM, sans appel payant.</text><text x="996" y="172" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#71717a">Ne fermez pas l’onglet.</text><text x="264" y="208" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#0d4d78">(b) Ce que la relecture conclut — le point est écrit</text><rect x="264" y="218" width="984" height="262" rx="14" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><rect x="264" y="218" width="6" height="262" rx="0" fill="#059669"/><text x="286" y="246" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="15" font-weight="700" fill="#059669">Point du 15/11 enregistré</text><text x="470" y="246" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#18181b">5 annonces relues · 2 baisses · 1 vente probable · 1 retiré sans vente · 1 prix au rendez-vous non relu</text><line x1="286" y1="296" x2="1226" y2="296" stroke="#e4e4e7" stroke-width="1"/><rect x="286" y="270" width="122" height="20" rx="10" fill="#fff" stroke="#059669" stroke-width="1"/><text x="347" y="283.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">Baisse</text><text x="420" y="284" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#18181b">Villa · 7 pièces · 205 m² · Mougins</text><text x="690" y="284" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#18181b">1 650 000 € au rendez-vous → 1 590 000 € aujourd’hui · −3,6 % · baisse vue le 03/11</text><line x1="286" y1="332" x2="1226" y2="332" stroke="#e4e4e7" stroke-width="1"/><rect x="286" y="306" width="122" height="20" rx="10" fill="#fff" stroke="#059669" stroke-width="1"/><text x="347" y="319.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">Baisse</text><text x="420" y="320" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#18181b">Villa · 7 pièces · 240 m² · Mougins</text><text x="690" y="320" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#18181b">1 745 000 € au rendez-vous → 1 695 000 € aujourd’hui · −2,9 % · baisse vue le 09/11</text><line x1="286" y1="368" x2="1226" y2="368" stroke="#e4e4e7" stroke-width="1"/><rect x="286" y="342" width="122" height="20" rx="10" fill="#fff" stroke="#d97706" stroke-width="1"/><text x="347" y="355.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#d97706" text-anchor="middle">Vente probable</text><text x="420" y="356" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#18181b">Villa · 7 pièces · 212 m² · Mougins</text><text x="690" y="356" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#18181b">Retirée le 03/11 après 150 jours : vente probable, négociation estimée de 5 à 10 % (1 529 000 à 1 614 000 €)</text><line x1="286" y1="404" x2="1226" y2="404" stroke="#e4e4e7" stroke-width="1"/><rect x="286" y="378" width="122" height="20" rx="10" fill="#fff" stroke="#71717a" stroke-width="1"/><text x="347" y="391.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#71717a" text-anchor="middle">Retiré sans vente</text><text x="420" y="392" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#18181b">Villa · 7 pièces · 220 m² · Mougins</text><text x="690" y="392" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#18181b">Retirée le 20/10 après 320 jours : retiré du marché sans vente</text><line x1="286" y1="440" x2="1226" y2="440" stroke="#e4e4e7" stroke-width="1"/><rect x="286" y="414" width="122" height="20" rx="10" fill="#fff" stroke="#b45309" stroke-width="1"/><text x="347" y="427.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">Non relu</text><text x="420" y="428" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#18181b">Villa · 7 pièces · 225 m² · Valbonne</text><text x="690" y="428" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#18181b">Prix au rendez-vous non relu ; prix du jour : 1 690 000 € · en vente depuis environ 160 jours</text><text x="286" y="464" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#71717a">« Ont baissé depuis le rendez-vous : 2 sur 5 » se calcule sur le prix du rendez-vous. Les conclusions sont des règles ACM (jours de commercialisation au retrait), toujours dites « estimées ».</text><text x="264" y="500" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#0d4d78">(c) La proposition payante — rien ne part sans le clic</text><rect x="264" y="510" width="984" height="148" rx="14" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><rect x="264" y="510" width="6" height="148" rx="0" fill="#059669"/><text x="286" y="540" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="16" font-weight="700" fill="#18181b">Chercher les nouveaux venus sur le marché ?</text><text x="286" y="564" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" fill="#18181b">Recherche payante sur le marché : jusqu’à 0,60 €. Les critères du dossier, les annonces vues sur le marché depuis le 12/10 seulement,</text><text x="286" y="582" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" fill="#18181b">sans celles déjà retenues ou écartées. Budget de recherche du mois : 4,20 € sur 30 €.</text><rect x="286" y="604" width="318" height="38" rx="19" fill="#0d4d78" stroke="#0d4d78" stroke-width="1.5"/><text x="445" y="627.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Chercher les nouveaux venus · jusqu’à 0,60 €</text><text x="624" y="626" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0d4d78">Pas maintenant</text><text x="1226" y="628" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#71717a" text-anchor="end">Le point du 15/11 est déjà écrit : « Pas maintenant » ferme le panneau et laisse « Points marché » à jour.</text><text x="264" y="690" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11.5" fill="#71717a">Chaque instant remplace le précédent dans le même panneau, sous la ligne du mandat. Le bouton « Mettre à jour les concurrents » reste grisé tant que l’enchaînement n’est pas fini.</text><text x="264" y="712" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11.5" fill="#71717a">Extension absente : le panneau dit « Installez ou activez l’extension ACM, puis réessayez. » avec « Réessayer » en contour, rien n’est écrit, aucun point n’est créé.</text><text x="264" y="734" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11.5" fill="#71717a">Budget du mois atteint : (c) dit « Budget de recherche du mois atteint : la recherche des nouveaux venus reviendra le 1er décembre. » et n’a pas de bouton plein ; le point est écrit quand même.</text>
</svg>
