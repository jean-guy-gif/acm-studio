e="9.5" font-weight="500" fill="#71717a" text-anchor="middle">Le plus bas</text><text x="161.6" y="494" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#18181b" text-anchor="middle">1 590 000 €</text><path d="M375.6 505 L383.6 514 L375.6 523 L367.6 514 Z" fill="#0d4d78"/><text x="375.6" y="458" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#0d4d78" text-anchor="middle">Prix médian · le plus dangereux, selon vous</text><text x="375.6" y="470" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0d4d78" text-anchor="middle">1 690 000 €</text><line x1="375.6" y1="504" x2="375.6" y2="473" stroke="#cbd5e1" stroke-width="1"/><circle cx="386.3" cy="514" r="6" fill="#94a3b8"/><text x="386.3" y="482" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#71717a" text-anchor="middle">Le plus haut</text><text x="386.3" y="494" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#18181b" text-anchor="middle">1 695 000 €</text><rect x="265.03" y="500" width="5" height="28" rx="2" fill="#059669"/><text x="267.53" y="556" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#059669" text-anchor="middle">Votre prix, inchangé</text><text x="267.53" y="572" font-family="Montserrat, Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#059669" text-anchor="middle">1 639 500 €</text><rect x="76" y="592" width="642" height="50" rx="0" fill="#e8f1f8"/><rect x="76" y="592" width="4" height="50" rx="0" fill="#0d4d78"/><text x="90" y="612" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#18181b">Aujourd’hui, 1 concurrent sur 3 est passé sous votre prix : vous êtes le 2e moins cher des</text><text x="90" y="628" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" font-weight="400" 