" height="50" rx="0" fill="#e8f1f8"/><rect x="76" y="854" width="4" height="50" rx="0" fill="#0d4d78"/><text x="90" y="874" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#18181b">Aucun nouveau venu retenu depuis le rendez-vous.</text><circle cx="62" cy="912" r="5" fill="#94a3b8"/><text x="72" y="916" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9" fill="#71717a">plus bas · plus haut</text><line x1="196" y1="905" x2="196" y2="918" stroke="#18181b" stroke-width="2.5"/><text x="204" y="916" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9" fill="#71717a">prix médian</text><path d="M282 905 L289 912 L282 919 L275 912 Z" fill="#0d4d78"/><text x="296" y="916" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9" fill="#71717a">le plus dangereux, selon vous</text><rect x="456" y="904" width="4" height="16" rx="2" fill="#059669"/><text x="466" y="916" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9" fill="#71717a">votre prix retenu ensemble</text><text x="56" y="934" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9" fill="#71717a">Couleur de votre prix : vert, sous +5 % de l’analyse de votre conseiller (ici « Prix aligné sur le marché ») · orange, de +5 à +10 % · rouge, au-delà. La même sur les trois lignes.</text><text x="56" y="1083" font-family="Montserrat, Inter, Arial, sans-serif" font-size="7.5" fill="#64748b" letter-spacing="1.2">ÉTUDE CONFIDENTIELLE · MOUGINS · 15 NOVEMBRE 2026</text><text x="738" y="1083" font-family="Montserrat, Inter, Arial, sans-serif" font-size="7.5" fill="#64748b" text-anchor="end">08 / 09</text>
