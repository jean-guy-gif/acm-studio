<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Montserrat, Inter, Arial, sans-serif">
<title>M127 — Suivi, après la mise à jour</title>
<rect x="0" y="0" width="1280" height="800" rx="0" fill="#fafafa"/>
<rect x="0" y="0" width="232" height="800" rx="0" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><rect x="20" y="20" width="192" height="32" rx="16" fill="#f4f4f5"/><rect x="22" y="22" width="94" height="28" rx="14" fill="#0d4d78"/><text x="69" y="40" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Vendeur</text><text x="163" y="40" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#71717a" text-anchor="middle">Acquéreur</text><text x="28" y="86" font-family="Montserrat, Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#18181b">Préparation</text><text x="28" y="104" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#71717a">Dossiers vendeurs</text><text x="28" y="148" font-family="Montserrat, Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#18181b">Live</text><text x="28" y="166" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#71717a">Rendez-vous vendeur</text><rect x="12" y="188" width="208" height="52" rx="10" fill="#e8f1f8"/><text x="28" y="210" font-family="Montserrat, Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0d4d78">Suivi</text><text x="28" y="228" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#71717a">Après le rendez-vous</text><text x="28" y="272" font-family="Montserrat, Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#18181b">Prospection</text><text x="28" y="290" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#71717a">Concurrents à démarcher</text><rect x="12" y="728" width="208" height="56" rx="10" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><text x="28" y="752" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#18181b">Compte de démonstration</text><text x="28" y="768" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#71717a">Mon compte et l’agence ▾</text><text x="264" y="50" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="28" font-weight="700" fill="#18181b">Suivi</text><text x="264" y="72" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12.5" fill="#71717a">Après la recherche des nouveaux venus : retenir ou écarter, puis ouvrir le Point marché.</text><rect x="264" y="92" width="984" height="560" rx="14" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><rect x="264" y="92" width="6" height="560" rx="0" fill="#059669"/><path d="M264 106 Q264 92 278 92 L270 92 Z" fill="#fff"/><text x="286" y="122" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="16" font-weight="700" fill="#18181b">M. Lefebvre</text><rect x="382" y="108" width="94" height="20" rx="10" fill="#ecfdf5"/><text x="429" y="121.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">Mandat signé</text><rect x="490" y="108" width="68" height="20" rx="10" fill="#e8f1f8"/><text x="524" y="121.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#0d4d78" text-anchor="middle">Exclusif</text><text x="286" y="144" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" fill="#71717a">Villa · 7 pièces · 210 m² · Mougins · conclu le 12/10 · Durée du Live : 48 min</text><text x="734" y="116" font-family="Montserrat, Inter, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#71717a" letter-spacing="1.4">LE CHEMIN PARCOURU</text><text x="734" y="140" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="14" font-weight="700" fill="#18181b">1 774 500 €  →  1 690 000 €  →  1 639 500 €</text><rect x="1006" y="126" width="46" height="20" rx="10" fill="#ecfdf5"/><text x="1029" y="139.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">−8 %</text><text x="734" y="172" font-family="Montserrat, Inter, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#71717a" letter-spacing="1.4">PRÊT À LANCER</text><text x="734" y="194" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="14" font-weight="700" fill="#18181b">7 → 10/10</text><rect x="1054" y="110" width="176" height="34" rx="17" fill="#0d4d78" stroke="#0d4d78" stroke-width="1.5"/><text x="1142" y="131.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Prospecter · 5 concurrents →</text><text x="1230" y="162" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" fill="#71717a" text-anchor="end">1 remis · 1 adresse à confirmer · 1 ne plus solliciter</text><text x="1230" y="192" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0d4d78" text-anchor="end">Voir le détail des prix ▾</text><rect x="286" y="214" width="130" height="32" rx="16" fill="#fff" stroke="#0d4d78" stroke-width="1.5"/><text x="351" y="234.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0d4d78" text-anchor="middle">Changer l’issue</text><rect x="430" y="214" width="230" height="32" rx="16" fill="#fff" stroke="#0d4d78" stroke-width="1.5"/><text x="545" y="234.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0d4d78" text-anchor="middle">Mettre à jour les concurrents</text><text x="734" y="234" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#71717a">Mise à jour faite le 15/11 à 10:42</text><rect x="286" y="262" width="940" height="212" rx="12" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/><text x="302" y="288" font-family="Rajdhani, Montserrat, Arial, sans-serif" font-size="15" font-weight="700" fill="#18181b">Nouveaux sur le marché depuis le rendez-vous</text><text x="302" y="306" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#71717a">2 trouvés · 0,20 € facturé · critères du dossier · vus sur le marché après le 12/10</text><rect x="302" y="322" width="908" height="62" rx="10" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><rect x="312" y="330" width="70" height="46" rx="0" fill="#cfd8e3"/><path d="M319 366.8 L338.6 350.7 L350.5 359.9 L359.6 353.92 L375 366.8 Z" fill="#b8c4d3"/><circle cx="364.5" cy="342.88" r="3.22" fill="#e6ecf3"/><text x="347" y="368" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9" fill="#6b7a92" text-anchor="middle"></text><text x="394" y="346" font-family="Montserrat, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#18181b">Villa · 7 pièces · 210 m² · Mougins</text><text x="394" y="364" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#71717a">1 830 000 € · 8 714 €/m² · Terrain 1 700 m² · 4 chambres · piscine · garage · DPE A · construite en 2018</text><text x="394" y="378" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#0d4d78">Vu sur le marché depuis le 02/11</text><rect x="1030" y="342" width="80" height="20" rx="10" fill="#ecfdf5"/><text x="1070" y="355.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">Retenu ✓</text><text x="1160" y="356" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#71717a">Écarter</text><rect x="302" y="394" width="908" height="62" rx="10" fill="#fff" stroke="#e4e4e7" stroke-width="1"/><rect x="312" y="402" width="70" height="46" rx="0" fill="#cfd8e3"/><path d="M319 438.8 L338.6 422.7 L350.5 431.9 L359.6 425.92 L375 438.8 Z" fill="#b8c4d3"/><circle cx="364.5" cy="414.88" r="3.22" fill="#e6ecf3"/><text x="347" y="440" font-family="Montserrat, Inter, Arial, sans-serif" font-size="9" fill="#6b7a92" text-anchor="middle"></text><text x="394" y="418" font-family="Montserrat, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#18181b">Villa · 7 pièces · 215 m² · Mougins</text><text x="394" y="436" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#71717a">1 580 000 € · 7 349 €/m² · Terrain 1 900 m² · 4 chambres · piscine · garage · DPE D · à rafraîchir</text><text x="394" y="450" font-family="Montserrat, Inter, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#0d4d78">Vu sur le marché depuis le 28/10</text><rect x="1024" y="408" width="90" height="32" rx="16" fill="#fff" stroke="#0d4d78" stroke-width="1.5"/><text x="1069" y="428.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0d4d78" text-anchor="middle">Retenir</text><text x="1130" y="430" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0d4d78">Écarter</text><line x1="286" y1="494" x2="1226" y2="494" stroke="#e4e4e7" stroke-width="1"/><text x="286" y="516" font-family="Montserrat, Inter, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#71717a" letter-spacing="1.4">POINTS MARCHÉ</text><text x="286" y="540" font-family="Montserrat, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#18181b">Point du 15/11</text><text x="400" y="540" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12" fill="#18181b">5 annonces relues · 2 baisses · 1 vente probable · 1 retiré sans vente · 2 nouveaux venus</text><rect x="1010" y="520" width="216" height="34" rx="17" fill="#fff" stroke="#0d4d78" stroke-width="1.5"/><text x="1118" y="541.5" font-family="Montserrat, Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0d4d78" text-anchor="middle">Ouvrir le Point marché →</text><text x="286" y="564" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#71717a">Ont baissé depuis le rendez-vous : 2 sur 5 · Depuis le rendez-vous, 2 des biens que nous avions vus ont baissé leur prix (repris dans « Préparer un message », M96).</text><text x="286" y="604" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11" fill="#71717a" font-style="italic">Un second point, plus tard, s’ajoute au-dessus : « Point du 20/12 » · son résumé · « Ouvrir ». Chaque point rouvre son document tel qu’il était.</text><rect x="264" y="676" width="984" height="100" rx="12" fill="#fff" stroke="#0d4d78" stroke-width="1" stroke-dasharray="5 4"/><text x="284" y="700" font-family="Montserrat, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d4d78">Lecture</text><text x="284" y="724" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11.5" fill="#18181b">• « Retenir » fait du nouveau venu un concurrent du dossier (sans prix du rendez-vous) : ligne 3 du point du jour, et Prospection. « Écarter » retire la carte, motif comme M50.</text><text x="284" y="746" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11.5" fill="#18181b">• Les deux cartes disent « Vu sur le marché depuis le … », jamais « Publié le ». Le résumé du point compte les nouveaux venus RETENUS.</text><text x="284" y="768" font-family="Montserrat, Inter, Arial, sans-serif" font-size="11.5" fill="#18181b">• « Ouvrir le Point marché → » mène à l’écran conseiller du document (maquette 05). Un seul bouton plein sur la ligne : « Prospecter ».</text>
</svg>
